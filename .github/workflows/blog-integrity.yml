name: blog-integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  blog-integrity:
    name: blog-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-blog.mjs
